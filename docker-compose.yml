services:
  rate-limiter:
    build: .
    container_name: rate-limiter
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8085"
      LOG_LEVEL: "info"
      RATE_LIMIT_CAPACITY: "10"
      RATE_LIMIT_REFILL_RATE: "5"
      RATE_LIMIT_KEY_HEADER: "X-Real-IP"
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8085/healthz || exit 1" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
